[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sksecurity"
dynamic = ["version"]
description = "Enterprise-grade security for AI agent ecosystems"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
keywords = [
    "security", "ai", "agents", "scanning", "threat-intelligence",
    "monitoring", "quarantine", "cybersecurity", "soc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "cryptography>=41.0.0,<44.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.0,<7.0.0",
    "watchdog>=3.0.0,<6.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
web = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
]
skcapstone = [
    "skcapstone>=0.6.8",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/smilinTux/SKSecurity"
Repository = "https://github.com/smilinTux/SKSecurity"
Issues = "https://github.com/smilinTux/sksecurity/issues"

[project.scripts]
sksecurity = "sksecurity.cli:main"
sksecurity-mcp = "sksecurity.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["sksecurity*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sksecurity = ["data/*.json", "data/*.yml", "templates/*.html", "static/*", "SKILL.md"]

[tool.setuptools_scm]
# The git tag IS the version. A push to the default branch cuts the next
# patch tag (see .github/workflows/publish.yml), so every release carries a
# genuinely new version instead of rebuilding 1.2.1 forever.
#
# These repos also carry NON-semver tags (swarm-20260717, fixwave-20260723,
# memory-index-fix-20260804, nextcloud-v0.3.0). setuptools-scm defaults to the
# newest tag of ANY shape, which derived a nonsense version like
# 20260805.dev25 for skcapstone. Both settings below restrict it to release
# tags only, matching the `--match 'v[0-9]*'` the tag job uses, so the two
# cannot disagree about which tag is current.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
