[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sksecurity"
# Derived from the git tag by setuptools-scm, NOT written here.
#
# It used to be a literal `version = "1.2.1"`, duplicated in
# sksecurity/__init__.py. Tags v1.2.2, v1.2.3 and v1.2.4 were all cut and pushed
# without either copy being bumped, so each release rebuilt 1.2.1 and PyPI
# rejected the duplicate with a bare `400 Bad Request`. That is why PyPI sat at
# 1.2.1 from 2026-06-11 while the repo was three tags ahead.
#
# The tag is now the single source of truth, which is what the rest of the fleet
# already does, so `git tag vX.Y.Z` cannot disagree with what gets built.
dynamic = ["version"]
description = "Enterprise-grade security for AI agent ecosystems"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
keywords = [
    "security", "ai", "agents", "scanning", "threat-intelligence",
    "monitoring", "quarantine", "cybersecurity", "soc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
]
dependencies = [
    "click>=8.0.0,<9.0.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "cryptography>=41.0.0,<44.0.0",
    "requests>=2.31.0,<3.0.0",
    "psutil>=5.9.0,<7.0.0",
    "watchdog>=3.0.0,<6.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
web = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
]
pdf = [
    "reportlab>=3.6.0",
]
skcapstone = [
    "skcapstone>=0.6.8",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    # Bounded: an unbounded `ruff>=0.1` let a minor release change the default
    # rule set under CI and turn a green gate red with no code change.
    "ruff>=0.15,<0.17",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/smilinTux/SKSecurity"
Repository = "https://github.com/smilinTux/SKSecurity"
Issues = "https://github.com/smilinTux/sksecurity/issues"

[project.scripts]
sksecurity = "sksecurity.cli:main"
sksecurity-mcp = "sksecurity.mcp_server:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Selected EXPLICITLY. With no config, `ruff check` uses ruff's own default
# rule set, which is not stable across releases: the dev extra asked for
# `ruff>=0.1` and the CI step reinstalled ruff unpinned on top, so it picked up
# 0.16, whose defaults added UP/BLE/FA/ISC. The Ruff lint step went red with
# 365 findings and no change to this repo, which is why py3.12 failed while
# py3.11 (which does not run lint) reached pytest.
#
# This is the set sksecurity has actually been enforcing (ruff's pre-0.16
# default), written down so it cannot drift again. Widening to UP/BLE is worth
# doing but is a real refactor and belongs in its own change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["sksecurity*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
sksecurity = ["data/*.json", "data/*.yml", "templates/*.html", "static/*", "SKILL.md"]

[tool.setuptools_scm]
# Generated at build time, gitignored. Never commit it: it is rewritten on every
# build, so a committed copy just goes stale and fights the formatter.
version_file = "sksecurity/_version.py"
fallback_version = "0.0.0+unknown"
