name: CI

# Pytest CI for the sksecurity Python package.
# Runs on GitHub-hosted runners (NOT a sovereign host).
#
# No exclusions: every test in tests/ runs on the public runner. Tests set
# SK_STANDALONE=1 and point HOME/SKCAPSTONE_HOME at tmp dirs (tests/conftest.py),
# so the optional skcapstone package is never needed or touched.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the history and the tags, otherwise the
          # installed version is 0.0.1.dev1+unknown and `--version` is
          # meaningless in CI.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Flat layout: the package lives at sksecurity/, NOT src/. Lint that path.
      # No `pip install ruff` here: it pulled the LATEST ruff on every run,
      # ignoring the bounded version in the dev extra installed above, so
      # ruff 0.16's wider defaults turned this gate red with no code change.
      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: ruff check sksecurity/

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
