name: Honest Claims

# The ecosystem no-overclaim gate. Fails the build if any tracked file
# asserts a forbidden security overclaim ("quantum-proof", "quantum-safe",
# "unbreakable", "uncrackable", "100% secure", or "military-grade" used as a
# security claim). Honest negations ("never quantum-proof"), quoted/meta
# references, and files listed in .honestclaims-allow are permitted.
#
# Claims must match the math: a classical KEM stays harvest-now-decrypt-later
# exposed; a hybrid scheme is only as strong as its strongest surviving leg.
# Cite the standard (FIPS 203/204/205), not the adjective.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  honest-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs history + tags, or the install resolves to
          # 0.0.1.dev1+unknown and `--version` means nothing.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sksecurity (bare, no extras)
        # Deliberately NO extras. This gate is the one place that exercises the
        # exact dependency closure a `pip install sksecurity` user gets, which
        # is how the reportlab import bug surfaced. Installing .[pdf] here
        # would hide the next one.
        run: pip install -e .
      - name: Run no-overclaim gate
        run: sksecurity claims scan .
      - name: Install pytest
        # Separate step so the CLI invocation above runs against the bare
        # install. `pip install -e .` never brought pytest in, so the test step
        # below could only ever fail with "No module named pytest" — masked
        # until now because the step above crashed first.
        run: pip install pytest
      - name: Honest-claims unit tests
        run: python -m pytest tests/test_honest_claims.py -v --tb=short
