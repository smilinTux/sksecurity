name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" || pip install -e .
      - run: python -m pytest tests/ -v --tb=short || true

  publish-pypi:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so the full
          # history and the tags must be present. A shallow checkout makes it
          # fall back to 0.0.0+unknown, and PyPI rejects a local version segment.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

# The publish-npm job was removed on 2026-08-14 (inc-cd653d5f). SKSecurity ships
# from PyPI; @smilintux/sksecurity on npm is frozen at 1.2.1 (2026-02-23) and the
# job failed every release run, which trained everyone to ignore release
# failures. Python is the supported distribution channel.
